<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NHindustry - পাসওয়ার্ড রিসেট</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #120905;
      --panel-bg: #1c110b;
      --panel-border: rgba(212, 160, 23, 0.15);
      --accent: #D4A017;
      --text-light: #F5EFE6;
      --text-muted: #A09080;
      --success: #4CAF50;
      --danger: #ef5350;
    }
    body {
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(28, 17, 11, 0.85);
      border: 1px solid rgba(212, 160, 23, 0.25);
      border-radius: 22px;
      padding: 34px 26px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
    }
    .brand {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .brand span { color: var(--accent); }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .row { margin-bottom: 16px; }
    label {
      display:block;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212, 160, 23, 0.2);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(212,160,23,0.1);
      background: rgba(255,255,255,0.08);
    }
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: 800;
      font-family: 'Hind Siliguri', sans-serif;
      background: linear-gradient(135deg, var(--accent) 0%, #b8860b 100%);
      color: #1a0a00;
      box-shadow: 0 6px 20px rgba(212,160,23,0.3);
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      display:none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .msg.visible { display:block; }
    .msg.error {
      background: rgba(239, 83, 80, 0.12);
      border: 1px solid rgba(239, 83, 80, 0.3);
      color: #ffb3b3;
    }
    .msg.success {
      background: rgba(76, 175, 80, 0.12);
      border: 1px solid rgba(76, 175, 80, 0.28);
      color: #8cffb1;
    }
    .linkrow {
      margin-top: 14px;
      display:flex;
      justify-content:center;
    }
    .backlink {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-light);
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">NH<span>industry</span></div>
    <div class="subtitle" id="subtitleText">রিসেট লিংকটি সম্পূর্ণ করতে নতুন পাসওয়ার্ড দিন।</div>

    <div class="msg error" id="errorBox"></div>
    <div class="msg success" id="successBox"></div>

    <div id="setPasswordPanel" style="display:none;">
      <div class="row">
        <label for="newPassword">নতুন পাসওয়ার্ড</label>
        <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="row" style="margin-bottom: 20px;">
        <label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <button class="btn" id="saveBtn" onclick="handleSaveNewPassword()">
        <span>💾 নতুন পাসওয়ার্ড সেভ করুন</span>
      </button>

      <div class="linkrow">
        <button class="backlink" type="button" onclick="goLogin()">⟵ লগইনে ফিরে যান</button>
      </div>
    </div>

    <div id="invalidPanel">
      <div style="font-size: 14px; color: var(--text-muted); line-height: 1.6;">
        এই রিসেট লিংকটি এখনই ব্যবহার করা যাচ্ছে না বা লিংকটি মেয়াদোত্তীর্ণ হতে পারে।
      </div>
      <div class="linkrow">
        <button class="backlink" type="button" onclick="goLogin()">⟵ লগইনে ফিরে যান</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    'use strict';

    let supabaseClient = null;

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.classList.add('visible');
    }

    function clearMessages() {
      const e = document.getElementById('errorBox');
      const s = document.getElementById('successBox');
      e.classList.remove('visible');
      s.classList.remove('visible');
      e.textContent = '';
      s.textContent = '';
    }

    function showSuccess(msg) {
      const box = document.getElementById('successBox');
      box.textContent = msg;
      box.classList.add('visible');
    }

    function getHashParam(name) {
      const hash = window.location.hash || '';
      // supports #access_token=...&refresh_token=... style
      const parts = hash.startsWith('#') ? hash.substring(1).split('&') : hash.split('&');
      for (const p of parts) {
        const [k, v] = p.split('=');
        if (k === name) return v ? decodeURIComponent(v) : '';
      }
      return '';
    }

    function hasRecoveryTokens() {
      const access = getHashParam('access_token');
      const refresh = getHashParam('refresh_token');
      return Boolean(access && refresh);
    }

    function initSupabase() {
      const supabaseUrl = 'https://mhxobwntkodvufpfkkkp.supabase.co';
      const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oeG9id250a29kdnVmcGZra2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1MTI3NjIsImV4cCI6MjEwMDA4ODc2Mn0.v5vAKsaBuuJmlDE4zbpT4crbfUij3rjixZpIBCMo58I';

      supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
    }

    async function applyRecoverySession() {
      const access_token = getHashParam('access_token');
      const refresh_token = getHashParam('refresh_token');

      if (!access_token || !refresh_token) return false;

      // Create a session from recovery tokens
      // (Supabase client v2 supports setSession)
      const { error } = await supabaseClient.auth.setSession({
        access_token,
        refresh_token
      });

      return !error;
    }

    function goLogin() {
      window.location.href = 'admin.html';
    }

    async function handleSaveNewPassword() {
      clearMessages();

      const btn = document.getElementById('saveBtn');
      const btnText = btn.textContent;

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!newPassword || !confirmPassword) {
        showError('অনুগ্রহ করে নতুন পাসওয়ার্ড প্রদান করুন।');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError('পাসওয়ার্ড মিলছে না।');
        return;
      }
      if (!supabaseClient) {
        showError('সার্ভার কনফিগারেশন সমস্যা। .env ফাইল চেক করুন।');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span style="display:flex;align-items:center;gap:10px;">⏳ সেভ করা হচ্ছে...</span>';

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;

        showSuccess('পাসওয়ার্ড সফলভাবে আপডেট হয়েছে।');
        // optional: sign out and go login
        await supabaseClient.auth.signOut();
        setTimeout(goLogin, 900);
      } catch (e) {
        console.error(e);
        showError('পাসওয়ার্ড আপডেট করা যায়নি। আবার চেষ্টা করুন।');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btnText;
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initSupabase();

      const invalidPanel = document.getElementById('invalidPanel');
      const setPasswordPanel = document.getElementById('setPasswordPanel');

      if (!supabaseClient) {
        showError('সার্ভার কনফিগারেশন সমস্যা। .env ফাইল চেক করুন।');
        return;
      }

      if (!hasRecoveryTokens()) {
        invalidPanel.style.display = 'block';
        setPasswordPanel.style.display = 'none';
        return;
      }

      const ok = await applyRecoverySession();
      if (!ok) {
        invalidPanel.style.display = 'block';
        setPasswordPanel.style.display = 'none';
        showError('এই রিসেট লিংকটি ব্যবহার করা যাচ্ছে না (token invalid/expired)।');
        return;
      }

      invalidPanel.style.display = 'none';
      setPasswordPanel.style.display = 'block';
      // Focus password
      setTimeout(() => document.getElementById('newPassword').focus(), 0);
    });
  </script>
</body>
</html>
